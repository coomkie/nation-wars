<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nation Wars — Bracket</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #wrap {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #tree {
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #tree:active { cursor: grabbing; }
      #hint {
        position: absolute;
        left: 16px;
        bottom: 12px;
        color: #fff;
        font-size: 14px;
        text-shadow: 0 1px 3px #000;
        opacity: 0.7;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
        text-shadow: 0 2px 8px #000;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <svg id="tree"></svg>
      <div id="empty">Waiting for bracket...</div>
      <div id="hint">Scroll to zoom · Drag to pan</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
